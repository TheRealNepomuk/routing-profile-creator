<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Layout Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header class="bar">
    <strong>Layout editor</strong>
    <span class="hint">Drag ⠿ to move sections, groups and options. Click any text to rename it. Saves automatically.</span>
    <span class="status" id="status"></span>
    <button type="button" id="addSection">+ Section</button>
    <button type="button" id="reset" class="danger">Reset to code</button>
  </header>

  <div class="split">
    <main class="tree">
      <div id="sections" class="list sections"></div>
      <section class="hidden-bin">
        <h2>Hidden options <span class="sub">drop options here to take them off the page (they keep OsmAnd's default)</span></h2>
        <div id="hidden" class="list fields"></div>
      </section>
    </main>
    <aside class="preview">
      <div class="preview-bar">
        <span>Live preview</span>
        <label><input type="radio" name="w" value="390" checked> Phone</label>
        <label><input type="radio" name="w" value="560"> Wide</label>
      </div>
      <iframe id="frame" src="../index.html?preview" title="Live preview"></iframe>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script type="module" src="editor.js"></script>
</body>
</html>
