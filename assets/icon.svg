<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- App icon: orange route over a faint road grid, as in the page background.
       Square on purpose: iOS and Android round the corners themselves.
       PNGs (icon-180/192/512.png) are rendered from this file. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14203a"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" fill="url(#bg)"/>
  <g fill="none" stroke="#2c4a7c" stroke-width="7" stroke-linecap="round" opacity=".75">
    <path d="M-10 62 C 50 72, 100 40, 190 58"/>
    <path d="M-10 126 C 60 110, 120 140, 190 118"/>
    <path d="M58 -10 C 66 60, 44 120, 62 190"/>
    <path d="M128 -10 C 118 70, 140 120, 124 190"/>
  </g>
  <path d="M40 146 C 52 112, 30 96, 74 86 S 112 92, 110 64 S 128 34, 142 34" fill="none" stroke="#ff8f00" stroke-width="13" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="40" cy="146" r="11" fill="#0a1120" stroke="#ff8f00" stroke-width="6"/>
  <circle cx="142" cy="34" r="11" fill="#ffad40"/>
</svg>
